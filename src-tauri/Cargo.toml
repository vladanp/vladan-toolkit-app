[package]
name = "vladan-toolkit"
version = "0.2.0"
description = "Vladan Toolkit: an all-in-one desktop toolkit."
authors = ["Vladan Petrovic"]
license = "MIT"
repository = "https://github.com/vladanp/vladan-toolkit-app"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "vladan_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
# Without the default `zip` feature: our updater artifacts are never zipped (createUpdaterArtifacts: true).
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
starship-battery = "0.12"
# Speed test: the same HTTP stack the updater already ships (rustls with ring, no new TLS).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# Typed Rust → TypeScript bindings. Pre-1.0: versions are pinned exactly on purpose.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Test-only plugins for native end-to-end tests. Never compiled into releases.
tauri-plugin-wdio = { version = "1.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
# Reads graphics card details from the display adapter class (System Info).
windows-registry = "0.6"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
# A local stand-in for the speed test server.
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }

[features]
default = []
# `pnpm e2e:build` enables this to embed a WebDriver server for @wdio/tauri-service.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Tauri commands receive owned values by design, and their return values are always used.
needless_pass_by_value = "allow"
must_use_candidate = "allow"
