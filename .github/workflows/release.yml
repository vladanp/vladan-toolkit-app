name: Release

# 1. Every push to main updates the "chore: release vX.Y.Z" PR (version + changelog from
#    Conventional Commits).
# 2. Merging that PR creates a *draft* GitHub Release and tag.
# 3. Installers are built on macOS (universal), Linux and Windows, signed for the updater
#    when keys are configured, attested (SLSA build provenance) and uploaded.
# 4. Only when every build succeeded is the release published, which also ships the update
#    to installed apps (they poll releases/latest/download/latest.json).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # release commits, tags and draft releases
      pull-requests: write # open and update the release PR
      issues: write # create release labels
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT/App token lets CI run on the release PR; the default token works otherwise.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    # Signing keys live in the protected `release` environment, not in repository secrets.
    environment: release
    permissions:
      contents: write # upload installers to the draft release
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: --target universal-apple-darwin, targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { name: Linux, os: ubuntu-22.04, args: '', targets: '' }
          - { name: Windows, os: windows-latest, args: '', targets: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: $/.github/actions/setup-js
      - uses: $/.github/actions/setup-rust
        with:
          targets: ${{ matrix.targets }}
          cache-key: release

      - name: Configure the updater (when signing keys exist)
        id: updater
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::notice::Updater keys not configured; building installers without update bundles."
            exit 0
          fi
          node scripts/updater-config.ts "$PUBKEY" "$REPOSITORY" > src-tauri/tauri.updater.conf.json
          echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"

      - name: Enable macOS code signing (when certificates exist)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Only export variables that are set: Tauri treats an empty APPLE_CERTIFICATE as
        # "sign with this (empty) certificate" and fails.
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: true
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  publish:
    name: Publish release
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
