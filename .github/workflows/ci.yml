name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1

jobs:
  # Two kinds of jobs keep CI lean: one Linux job for everything web, and one job per OS
  # that compiles the Rust side once for clippy, tests and the real-app E2E run.
  web:
    name: Web (lint, unit, E2E)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Commit linting needs the PR's history.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: $/.github/actions/setup-js
      - run: pnpm biome ci .
      - run: pnpm typecheck
      - name: Scan for committed secrets
        run: pnpm lint:secrets
      - name: Writing style (no dashes as punctuation)
        run: pnpm lint:dashes
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # Chromium ≈ WebView2 (Windows); WebKit ≈ WKWebView (macOS) and WebKitGTK (Linux).
      - run: pnpm playwright install --with-deps chromium webkit
      - name: Unit & component tests with coverage thresholds
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.ts coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: End-to-end and accessibility tests (Chromium and WebKit)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-js
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: desktop
      - name: Format
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Stub frontend build
        # `generate_context!` embeds ../dist at compile time; clippy and tests don't need the
        # real UI. The E2E build below replaces it with the real one.
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov
      - name: Rust tests (with the coverage threshold on Linux; includes the bindings check)
        working-directory: src-tauri
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs' \
              --fail-under-lines 80 --summary-only | tee coverage.txt
            { echo '### Rust coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            cargo test --locked
          fi
      - name: Build the app with the embedded WebDriver
        run: pnpm e2e:native:build
      - name: Drive the real app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm e2e:native
          else
            pnpm e2e:native
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-e2e-logs-${{ matrix.os }}
          path: e2e/native/logs/
          retention-days: 7

  bundle:
    name: Bundle (${{ matrix.name }})
    # Installers on demand (Actions → CI → Run workflow). Releases build their own.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: --target universal-apple-darwin, targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { name: Linux, os: ubuntu-22.04, args: '', targets: '' }
          - { name: Windows, os: windows-latest, args: '', targets: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-js
      - uses: $/.github/actions/setup-rust
        with:
          targets: ${{ matrix.targets }}
          cache-key: bundle
      - name: Build installers
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<< "$ARGS"
          pnpm tauri build "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7

  ci-ok:
    name: CI OK
    # The single required status check for branch protection.
    if: always()
    needs: [web, desktop, bundle]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
