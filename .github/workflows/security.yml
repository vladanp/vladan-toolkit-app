name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so newly published advisories surface even when nothing changes here.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
      pull-requests: write # comment the review summary on failing PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          comment-summary-in-pr: on-failure

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-js
      - name: Shipped dependencies (no exceptions)
        run: pnpm audit --prod --audit-level low
      - name: All dependencies (accepted risks are listed in pnpm-workspace.yaml)
        run: pnpm audit --audit-level moderate

  cargo-deny:
    name: Rust advisories, licenses & sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          arguments: --all-features

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
