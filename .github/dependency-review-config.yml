# Policy for `actions/dependency-review-action` (Security workflow, on pull requests).

fail-on-severity: moderate

# Allow-list instead of deny-list: a dual-licensed package (e.g. jszip "MIT OR GPL-3.0",
# r-efi "MIT OR Apache-2.0 OR LGPL-2.1") passes because one of its options is allowed.
# Same policy as src-tauri/deny.toml, plus font (OFL) and data (CC-BY) licenses from npm.
allow-licenses:
  - MIT
  - MIT-0
  - ISC
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - BlueOak-1.0.0
  - Artistic-2.0
  - MPL-2.0
  - Zlib
  - Unicode-3.0
  - BSL-1.0
  - Unlicense
  - CC0-1.0
  - WTFPL
  - Python-2.0
  - OFL-1.1 # bundled UI fonts (Inter, JetBrains Mono)
  - CC-BY-3.0 # spdx-exceptions data
  - CC-BY-4.0 # caniuse-lite data
  - CDLA-Permissive-2.0 # webpki-root-certs (Mozilla's CA certificate data)

# These crates declare "A/B" (pre-SPDX syntax for "A OR B") in Cargo.toml, which GitHub
# can't parse. Both options are on the allow-list above; cargo-deny verifies them properly.
allow-dependencies-licenses:
  - pkg:cargo/brotli-decompressor # BSD-3-Clause/MIT
  - pkg:cargo/dbus # Apache-2.0/MIT
  - pkg:cargo/libdbus-sys # Apache-2.0/MIT

# Accepted risks: only advisories with no fixed version reachable from our dependency tree.
# Revisit when upstream moves; remove the entry as soon as a fix is available.
allow-ghsas:
  # glib 0.18 `VariantStrIter` unsoundness (fixed only in glib >= 0.20). Pulled in by Tauri's
  # GTK3 webview stack on Linux, which is pinned to gtk-rs 0.18; nothing calls VariantStrIter.
  - GHSA-wrw7-89jp-8q8g
