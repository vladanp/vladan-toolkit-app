# Weekly dependency updates. Commit prefixes feed release-please:
#   runtime deps → "fix(deps)" (ships a patch release), dev deps / actions → no release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let fresh releases settle before adopting them (pnpm also refuses <24h-old versions).
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: fix
      include: scope
    groups:
      tauri:
        patterns: ['tauri*']
        update-types: [minor, patch]
      rust-dependencies:
        patterns: ['*']
        exclude-patterns: ['tauri*', 'specta*', 'tauri-specta']
        update-types: [minor, patch]
    # specta/tauri-specta are pre-1.0 and pinned on purpose; bump them deliberately.
    ignore:
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
